<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <style>
        body{
            height: 100vh;
            background-color: rgb(176 196 222 / 0.65);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .animation img{
            height: 200px;
        }
        .animation{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        @keyframes balloon {
            from{ transform: translateY(0) scale(1);
            }
            50%{ transform: translateY(-80px) scale(0.8);

            }
            100% {
                transform: translateY(0) scale(1);
            }

        }

        .air-balloon{
         animation: balloon 10s ease-in-out infinite;

        }

    </style>
</head>
<body>
<div class="animation">
    <img class="air-balloon" src="img/air-balloon.png" alt="balloon">
</div>
</body>
</html>
